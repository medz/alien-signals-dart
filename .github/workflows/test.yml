name: testing

on: [push, pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: latest
      - run: dart pub get
      - run: dart analyze
      - name: Validate package skills
        run: dart run skills_lint --skills-directory skills --published-skill-name --check-relative-paths
      - name: Run examples with assertions
        run: |
          for example in example/*.dart; do
            dart --enable-asserts run "$example"
          done
      - name: Build API documentation
        run: dart doc --validate-links --output build/api

  test:
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [stable, '3.13.0']
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart test

  compile-web:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: latest
      - run: dart pub get
      - run: dart compile js test/fixtures/dart2js_entry.dart -o /tmp/alien_signals_entry.js
      - run: dart compile wasm test/fixtures/dart2js_entry.dart -o /tmp/alien_signals_entry.wasm
